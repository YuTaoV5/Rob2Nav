name: Voice task control
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy fastapi httpx
      - run: python -m unittest discover -s tests -p 'test_voice*.py' -v
      - run: bash -n scripts/install_voice.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: studio/frontend
