[program:rob2nav-navigation]
directory=/root/gpufree-data/Rob2Nav
command=/root/gpufree-data/envs/go2-mapless/bin/python -m skills.navigation.live --port 8768 --checkpoint skills/navigation/policy/navigation.zip
environment=MUJOCO_GL="egl",PYTHONUNBUFFERED="1",OMP_NUM_THREADS="1",OPENBLAS_NUM_THREADS="1"
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/root/gpufree-data/deployment/navigation-live.log
stdout_logfile_maxbytes=20MB
redirect_stderr=true
