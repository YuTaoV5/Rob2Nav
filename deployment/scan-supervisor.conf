[program:rob2nav-scan-bridge]
directory=/root/gpufree-data/Rob2Nav
command=/bin/bash /root/gpufree-data/Rob2Nav/deployment/start-scan-bridge.sh
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/root/gpufree-data/deployment/scan-bridge.log
stdout_logfile_maxbytes=20MB
redirect_stderr=true

[program:rob2nav-scan]
directory=/root/gpufree-data/Rob2Nav
command=/root/gpufree-data/envs/go2-mapless/bin/python -m skills.navigation.live --port 8769 --planner scan
environment=MUJOCO_GL="egl",PYTHONUNBUFFERED="1",OMP_NUM_THREADS="1",OPENBLAS_NUM_THREADS="1"
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/root/gpufree-data/deployment/scan-live.log
stdout_logfile_maxbytes=20MB
redirect_stderr=true
