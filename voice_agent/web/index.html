<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Go2 语音任务台</title><link rel="stylesheet" href="./style.css"></head>
<body><header><div><span class="eyebrow">GO2 · SCAN · ROB2NAV</span><h1>语音任务台</h1></div><div class="header-right"><span id="mode" class="pill">连接中</span><button id="token">访问令牌</button><button id="emergency" class="danger">急停</button></div></header>
<main><section class="map-panel card"><div class="title-row"><div><h2>地图与地点</h2><p id="mapInfo">正在读取地图</p></div><button id="fit">适应地图</button></div>
<div class="map-controls"><label>点云 z 下限<input id="zMin" type="number" step="0.1" placeholder="不限"></label><label>z 上限<input id="zMax" type="number" step="0.1" placeholder="不限"></label><button id="slice">应用切片</button></div>
<div class="canvas-wrap"><canvas id="map"></canvas><span class="map-hint">点击选点 · 点击地点编辑 · 滚轮缩放 · 按住 Shift 拖动</span></div>
<form id="placeForm"><input id="placeId" type="hidden"><div class="form-grid"><label>地点名称<input id="placeName" required maxlength="60" placeholder="一楼会议室"></label><label>别名（逗号分隔）<input id="aliases" placeholder="办公室,开会的地方"></label><label>楼层<input id="floor" value="一楼" required></label><label>机身目标 z（米，需实测）<input id="pz" type="number" step="0.01" value="0.4" required></label><label>x（米）<input id="px" type="number" step="0.01" required></label><label>y（米）<input id="py" type="number" step="0.01" required></label><label>目标朝向 yaw（度）<input id="yaw" type="number" step="1" value="0" required></label><label>技能区域半径（米）<input id="radius" type="number" min="0.01" max="5" step="0.1" value="0.5" required></label></div>
<div class="checks"><span>此处允许的技能：</span><label><input type="checkbox" value="backflip" name="zone">后空翻</label><label><input type="checkbox" value="sideflip" name="zone">侧空翻</label><label><input type="checkbox" value="handstand" name="zone">倒立</label></div>
<div class="actions"><button class="primary" type="submit">保存标注</button><button id="newPlace" type="button">新建地点</button><button id="deletePlace" type="button">删除所选地点</button><span id="saved"></span></div></form>
<details><summary>可通行路线图</summary><p>只连接已经检查可通行的节点。实机导航沿这些边选路。</p><div class="route-row"><select id="edgeFrom"></select><span>→</span><select id="edgeTo"></select><label><input id="bidirectional" type="checkbox" checked>双向</label><button id="connect">连接</button></div><div id="edges"></div></details></section>
<aside><section class="card"><div class="title-row"><h2>控制与反馈</h2><span id="state" class="pill">DISABLED</span></div><p id="health">等待状态</p><div id="reply" role="status">控制未启用。</div><div class="actions"><button id="enable" class="primary">启用控制</button><button id="stop">停止 / 站立</button><button id="disable">关闭控制</button></div><p id="task" class="muted"></p></section>
<section class="card"><h2>说话或输入指令</h2><p>例如：“去一楼会议室”“来个后空翻”“停止”。</p><button id="talk" class="talk">按住说话</button><p id="speechInfo" class="muted">可先使用文本测试</p><form id="commandForm" class="command-row"><input id="command" autocomplete="off" placeholder="小狗，去会议室" maxlength="200" required><button type="submit" class="primary">发送</button></form><label class="tts-toggle"><input id="tts" type="checkbox">语音播报回复</label><p id="timing" class="muted"></p></section>
<section class="card"><h2>地点与技能</h2><div id="placeButtons" class="button-grid"></div><div class="button-grid skills"><button data-skill="后空翻">后空翻</button><button data-skill="侧空翻">侧空翻</button><button data-skill="倒立">倒立</button></div><p class="muted">演示模式验证任务流程；真实模式由底层检查权重、状态与执行资格。</p></section>
<section class="card"><h2>任务记录</h2><div id="events" class="events"></div></section></aside></main><div id="toast" role="alert"></div><script src="./app.js"></script></body></html>
