seed: 42
device: cuda:0
num_steps_per_env: 24
max_iterations: 1500
empirical_normalization: null
obs_groups:
  policy:
  - policy
  critic:
  - critic
clip_actions: null
save_interval: 100
experiment_name: unitree_go2_rough
run_name: ''
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: model_.*.pt
class_name: OnPolicyRunner
policy:
  class_name: MoEPerceptiveActorCritic
  init_noise_std: 0.15
  noise_std_type: log
  state_dependent_std: false
  actor_obs_normalization: false
  critic_obs_normalization: false
  actor_hidden_dims:
  - 512
  - 256
  - 128
  critic_hidden_dims:
  - 256
  - 128
  - 64
  activation: elu
  moe_checkpoint: vendor/RoboGauge/resources/models/go2/go2_moe_cts_137k_0.6739.pt
  goal_conditioned: true
algorithm:
  class_name: PPO
  num_learning_epochs: 4
  num_mini_batches: 4
  learning_rate: 0.0002
  schedule: fixed
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.001
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  rnd_cfg: null
  symmetry_cfg: null
